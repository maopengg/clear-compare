[package]
name = "clear-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clear-contracts.workspace = true
serde_json.workspace = true
serde.workspace = true
globset = "0.4"
walkdir = "2"
sha2 = "0.10"
sha1 = "=0.10.7"
similar = "2"
tempfile = "3"
thiserror = "2"

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

scraper = { version = "=0.27.0", default-features = false }
html5ever = "=0.39.0"

same-file = "=1.0.6"
unicode-normalization = "=0.1.25"
calamine = { version = "=0.36.1", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }
regex = "=1.13.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
