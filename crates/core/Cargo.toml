[package]
name = "clear-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clear-contracts.workspace = true
serde_json.workspace = true
serde.workspace = true
globset = "0.4"
walkdir = "2"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

scraper = { version = "=0.27.0", default-features = false }
html5ever = "=0.39.0"
